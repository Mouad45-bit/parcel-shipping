services:
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    pull_policy: build
    container_name: parcel-config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_APPLICATION_NAME: config-server
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repository
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8888/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - parcel-network

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    pull_policy: build
    container_name: parcel-discovery-server
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: discovery-server
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8761/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - parcel-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    pull_policy: build
    container_name: parcel-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - parcel-network

  shipments-postgres:
    image: postgres:17-alpine
    container_name: parcel-shipments-postgres
    hostname: shipments-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: shipments_db
      POSTGRES_USER: shipments_user
      POSTGRES_PASSWORD: shipments_password
    volumes:
      - shipments-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U shipments_user -d shipments_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      parcel-network:
        aliases:
          - shipments-postgres

  pod-generator-service:
    build:
      context: ./pod-generator-service
      dockerfile: Dockerfile
    pull_policy: build
    container_name: parcel-pod-generator-service
    expose:
      - "8090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8090/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - parcel-network

  shipments-service:
    build:
      context: .
      dockerfile: shipments-service/Dockerfile
    pull_policy: build
    scale: ${BUSINESS_SERVICE_REPLICAS:-2}
    expose:
      - "8081"
    environment:
      SPRING_APPLICATION_NAME: shipments-service
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SHIPMENT_PODS_STORAGE_ROOT: /data/pods
      SHIPMENT_EXPORTS_STORAGE_ROOT: /data/exports
      POD_GENERATOR_BASE_URL: ${POD_GENERATOR_BASE_URL:-http://pod-generator-service:8090}
      POD_GENERATOR_CONNECT_TIMEOUT: ${POD_GENERATOR_CONNECT_TIMEOUT:-3s}
      POD_GENERATOR_READ_TIMEOUT: ${POD_GENERATOR_READ_TIMEOUT:-20s}
      SHIPMENT_POD_SEED_ENABLED: ${SHIPMENT_POD_SEED_ENABLED:-false}
      SHIPMENT_POD_SEED_MINIMUM_COUNT: ${SHIPMENT_POD_SEED_MINIMUM_COUNT:-1}
      SHIPMENT_POD_SEED_MAXIMUM_COUNT: ${SHIPMENT_POD_SEED_MAXIMUM_COUNT:-3}
      SHIPMENT_POD_SEED_RANDOM_SEED: ${SHIPMENT_POD_SEED_RANDOM_SEED:-parcel-shipping-local}
      SHIPMENT_POD_SEED_BATCH_SIZE: ${SHIPMENT_POD_SEED_BATCH_SIZE:-100}
      SHIPMENT_POD_SEED_FAIL_FAST: ${SHIPMENT_POD_SEED_FAIL_FAST:-true}
      LOAD_BALANCING_OBSERVATION_ENABLED: "true"
      LOAD_BALANCING_SCENARIO: ${LOAD_BALANCING_SCENARIO:-two-instances}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      shipments-postgres:
        condition: service_healthy
      pod-generator-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8081/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - parcel-network
    volumes:
      - shipment-pods-data:/data/pods
      - shipment-exports-data:/data/exports

  statistics-service:
    build:
      context: .
      dockerfile: statistics-service/Dockerfile
    pull_policy: build
    scale: ${BUSINESS_SERVICE_REPLICAS:-2}
    expose:
      - "8083"
    environment:
      SPRING_APPLICATION_NAME: statistics-service
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      LOAD_BALANCING_OBSERVATION_ENABLED: "true"
      LOAD_BALANCING_SCENARIO: ${LOAD_BALANCING_SCENARIO:-two-instances}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      shipments-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8083/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - parcel-network

  users-postgres:
    image: postgres:17-alpine
    container_name: parcel-users-postgres
    hostname: users-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: users_user
      POSTGRES_PASSWORD: users_password
    volumes:
      - users-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U users_user -d users_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      parcel-network:
        aliases:
          - users-postgres

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    pull_policy: build
    scale: ${BUSINESS_SERVICE_REPLICAS:-2}
    expose:
      - "8082"
    environment:
      SPRING_APPLICATION_NAME: auth-service
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      LOAD_BALANCING_OBSERVATION_ENABLED: "true"
      LOAD_BALANCING_SCENARIO: ${LOAD_BALANCING_SCENARIO:-two-instances}
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      users-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8082/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - parcel-network

  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - parcel-network
    depends_on:
      discovery-server:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - parcel-network
    depends_on:
      - prometheus

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    expose:
      - "8080"
    networks:
      - parcel-network

networks:
  parcel-network:
    driver: bridge

volumes:
  shipments-postgres-data:
  users-postgres-data:
  shipment-pods-data:
  shipment-exports-data:
  prometheus-data:
  grafana-data:
