services:
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: parcel-config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-repository:/config-repository:ro
    environment:
      SPRING_APPLICATION_NAME: config-server
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repository
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - parcel-network

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: parcel-discovery-server
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: discovery-server
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - parcel-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: parcel-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - parcel-network

  postgres:
    image: postgres:17-alpine
    container_name: parcel-postgres
    hostname: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: parcel_shipping
      POSTGRES_USER: parcel_user
      POSTGRES_PASSWORD: parcel_password
    volumes:
      - parcel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U parcel_user -d parcel_shipping" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      parcel-network:
        aliases:
          - postgres

  shipments-service:
    build:
      context: .
      dockerfile: shipments-service/Dockerfile
    container_name: parcel-shipments-service
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: shipments-service
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - parcel-network

networks:
  parcel-network:
    driver: bridge

volumes:
  parcel-postgres-data:
