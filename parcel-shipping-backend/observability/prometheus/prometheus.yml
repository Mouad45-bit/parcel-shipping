global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: business-services
    metrics_path: /actuator/prometheus

    eureka_sd_configs:
      - server: http://discovery-server:8761/eureka
        refresh_interval: 10s

    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        regex: AUTH-SERVICE|SHIPMENTS-SERVICE|STATISTICS-SERVICE
        action: keep

      - source_labels: [__meta_eureka_app_instance_status]
        regex: UP
        action: keep

      - source_labels: [__meta_eureka_app_name]
        target_label: service

      - source_labels: [__meta_eureka_app_instance_id]
        target_label: instance

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
