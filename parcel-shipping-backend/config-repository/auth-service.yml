server:
  port: 8082

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://users-postgres:5432/users_db
    username: users_user
    password: users_password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    issuer: parcel-shipping-auth-service
    audience: parcel-shipping-backoffice
    secret: ${AUTH_JWT_SECRET}
    ttl: 30m

    cookie:
      name: parcel_access_token
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: Lax

load-balancing:
  observation:
    enabled: ${LOAD_BALANCING_OBSERVATION_ENABLED:true}

eureka:
  instance:
    instance-id: ${spring.application.name}:${HOSTNAME:${random.value}}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  info:
    env:
      enabled: true
