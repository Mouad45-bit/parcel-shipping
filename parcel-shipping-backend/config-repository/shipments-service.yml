server:
  port: 8081

spring:
  application:
    name: shipments-service

  datasource:
    url: jdbc:postgresql://postgres:5432/parcel_shipping
    username: parcel_user
    password: parcel_password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  info:
    env:
      enabled: true
