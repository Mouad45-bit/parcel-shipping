server:
  port: 8081

spring:
  application:
    name: shipments-service

  datasource:
    url: jdbc:postgresql://shipments-postgres:5432/shipments_db
    username: shipments_user
    password: shipments_password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  info:
    env:
      enabled: true

shipment-storage:
  pods-root: ${SHIPMENT_PODS_STORAGE_ROOT:/data/pods}
  exports-root: ${SHIPMENT_EXPORTS_STORAGE_ROOT:/data/exports}