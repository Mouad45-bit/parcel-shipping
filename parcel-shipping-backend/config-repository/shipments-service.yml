server:
  port: 8081

spring:
  application:
    name: shipments-service

  datasource:
    url: jdbc:postgresql://shipments-postgres:5432/shipments_db
    username: shipments_user
    password: shipments_password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  info:
    env:
      enabled: true

shipment-storage:
  pods-root: ${SHIPMENT_PODS_STORAGE_ROOT:/data/pods}
  exports-root: ${SHIPMENT_EXPORTS_STORAGE_ROOT:/data/exports}

pod-generator:
  base-url: ${POD_GENERATOR_BASE_URL:http://pod-generator-service:8090}
  connect-timeout: ${POD_GENERATOR_CONNECT_TIMEOUT:3s}
  read-timeout: ${POD_GENERATOR_READ_TIMEOUT:20s}

shipment-pod-seed:
  enabled: ${SHIPMENT_POD_SEED_ENABLED:false}
  minimum-count: ${SHIPMENT_POD_SEED_MINIMUM_COUNT:1}
  maximum-count: ${SHIPMENT_POD_SEED_MAXIMUM_COUNT:3}
  random-seed: ${SHIPMENT_POD_SEED_RANDOM_SEED:parcel-shipping-local}
  batch-size: ${SHIPMENT_POD_SEED_BATCH_SIZE:100}
  fail-fast: ${SHIPMENT_POD_SEED_FAIL_FAST:true}