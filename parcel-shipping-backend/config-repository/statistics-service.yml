server:
  port: 8083

spring:
  application:
    name: statistics-service

  datasource:
    url: jdbc:postgresql://shipments-postgres:5432/shipments_db
    username: shipments_user
    password: shipments_password

    hikari:
      read-only: true
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 5000

  flyway:
    enabled: false

eureka:
  instance:
    instance-id: ${spring.application.name}:${HOSTNAME:${random.value}}
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  info:
    env:
      enabled: true

  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  metrics:
    tags:
      application: ${spring.application.name}
      topology: ${LOAD_BALANCING_SCENARIO:unspecified}

    distribution:
      percentiles-histogram:
        http.server.requests: true

load-balancing:
  observation:
    enabled: ${LOAD_BALANCING_OBSERVATION_ENABLED:true}
